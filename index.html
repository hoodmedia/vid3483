<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hood Media</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;
}

.container{
width:100%;
max-width:420px;
position:relative;
}

/* IKLAN ATAS & BAWAH */
.ad-box{
width:100%;
margin:12px 0;
text-align:center;
}

/* VIDEO */
video{
width:100%;
border-radius:12px;
background:#000;
}

/* TITLE */
.title{
font-size:16px;
margin:12px 0;
text-align:center;
}

/* 🔥 OVERLAY IKLAN */
.overlay-ad{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
border-radius:12px;
}

.overlay-ad .content{
text-align:center;
}

/* tombol close */
.close-btn{
margin-top:12px;
padding:8px 14px;
background:#fff;
color:#000;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
}
</style>
</head>

<body>

<div class="container">

<!-- IKLAN ATAS -->
<div class="ad-box">
<!-- <script>
  atOptions = {
    'key' : '2b7e76e37b7f6c2fc55e3b3cc5249be3',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/2b7e76e37b7f6c2fc55e3b3cc5249be3/invoke.js"></script>
 -->
</div>

<video id="videoPlayer" controls autoplay muted playsinline>
<source id="videoSource" src="" type="video/mp4">
</video>

<!-- IKLAN BAWAH -->
<div class="ad-box">
<!-- <script>
  atOptions = {
    'key' : '2b7e76e37b7f6c2fc55e3b3cc5249be3',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/2b7e76e37b7f6c2fc55e3b3cc5249be3/invoke.js"></script>
 -->
</div>

<div class="title">
Watch till the end 😳🔥
</div>

<!-- 🔥 https://www.profitablecpmratenetwork.com/fut0gi5x?key=fc9ef4212d7629163d3f1e0263d3394a -->
<div class="overlay-ad" id="overlayAd">
<div class="content">

<!-- https://www.profitablecpmratenetwork.com/fut0gi5x?key=fc9ef4212d7629163d3f1e0263d3394a -->

<button class="close-btn" onclick="closeAd()">Close</button>

</div>
</div>

</div>

<script>
// ambil parameter ?v=
const params = new URLSearchParams(window.location.search);
const videoId = params.get("v");

const video = document.getElementById("videoPlayer");
const source = document.getElementById("videoSource");
const overlay = document.getElementById("overlayAd");

if(videoId){
source.src = "https://cdn.videy.co/" + videoId + ".mp4";
video.load();
}else{
document.querySelector(".title").innerText = "Video tidak ditemukan";
}

// 🔥 EVENT: video selesai
video.addEventListener("ended", function(){
overlay.style.display = "flex";
});

// tombol close iklan
function closeAd(){
overlay.style.display = "none";
}
</script>

</body>
</html>
